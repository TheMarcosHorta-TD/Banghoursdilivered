<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hours Delivered — Drill-Down Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap');

:root {
  --black: #000000;
  --red: #ED1B2E;
  --gray: #A7A9AB;
  --yellow: #F0E145;
  --tealgreen: #95D5D1;
  --lightblue: #A0DAE7;
  --purple: #6E4E6E;
  --orange: #F8A97F;
  --pink: #F17191;
  --paleblue: #D5E2E8;
  --paper: #FDFCF9;
  --line: #E7E4DC;
  --muted: #6b675f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: var(--paper);
  color: var(--black);
  -webkit-font-smoothing: antialiased;
  position: relative; overflow-x: hidden;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 24px 80px; }

.bg-blob { position: fixed; border-radius: 50%; z-index: -1; opacity: 0.35; pointer-events: none; }
.bg-blob.b1 { width: 340px; height: 340px; background: var(--yellow); top: -140px; right: -100px; border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; }
.bg-blob.b2 { width: 260px; height: 260px; background: var(--tealgreen); bottom: -100px; left: -80px; border-radius: 58% 42% 35% 65% / 52% 39% 61% 48%; }
.bg-blob.b3 { width: 180px; height: 180px; background: var(--orange); top: 40%; right: -90px; border-radius: 50% 50% 38% 62% / 62% 44% 56% 38%; opacity: 0.22; }

.brandmark { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.brandmark img { transition: transform 0.35s cubic-bezier(.34,1.56,.64,1); }
.brandmark:hover img { transform: rotate(-2deg) scale(1.04); }
.brandmark .divider { width: 2px; align-self: stretch; background: var(--line); margin: 4px 4px; }
.brandmark .page-title { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; color: var(--black); letter-spacing: -0.5px; }
.brandmark .page-subtitle { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 5px; }
.handwritten { font-family: 'Caveat', cursive; font-weight: 700; color: var(--red); font-size: 17px; }

.proto-tag {
  font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  background: var(--yellow); color: var(--black); padding: 4px 10px; border-radius: 20px;
}
.subtitle { color: var(--muted); font-size: 13.5px; margin: 4px 0 18px; }

.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 14px; flex-wrap: wrap; }
.crumbs button { background: none; border: none; cursor: pointer; font: inherit; color: var(--muted); padding: 5px 10px; border-radius: 20px; }
.crumbs button:hover { background: #eee; color: var(--black); }
.crumbs button.active { background: var(--black); color: white; }
.crumbs .sep { color: #c9c5ba; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 700; font-size: 13px;
  border: 2px solid var(--black); background: white; color: var(--black); padding: 7px 14px 7px 10px;
  border-radius: 20px; cursor: pointer; margin-bottom: 16px;
}
.back-btn:hover { background: var(--black); color: white; }

.nav-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.nav-row.leaderboard-row { margin-top: -4px; margin-bottom: 18px; padding-top: 12px; border-top: 1px dashed var(--line); }
.nav-btn { font: inherit; font-weight: 700; font-size: 12px; border: 2px solid var(--black); background: white; color: var(--black); padding: 5px 12px; border-radius: 20px; cursor: pointer; }
.nav-btn.active { background: var(--red); border-color: var(--red); color: white; }
.nav-btn:not(.active):hover { background: #f2f2f2; }
.leaderboard-btn { font-weight: 800; box-shadow: 2px 2px 0 rgba(0,0,0,0.12); }
.leaderboard-btn.guns { background: var(--yellow); border-color: var(--black); color: var(--black); }
.leaderboard-btn.guns.active { background: var(--red); border-color: var(--red); color: white; }
.leaderboard-btn.full { background: var(--black); border-color: var(--black); color: white; }
.leaderboard-btn.full.active { background: var(--red); border-color: var(--red); color: white; }
.leaderboard-btn.goal { background: var(--tealgreen); border-color: var(--black); color: var(--black); }
.leaderboard-btn.goal.active { background: var(--red); border-color: var(--red); color: white; }
.leaderboard-btn.risk { background: var(--orange); border-color: var(--black); color: var(--black); }
.leaderboard-btn.risk.active { background: var(--red); border-color: var(--red); color: white; }
.leaderboard-btn.growth { background: var(--lightblue); border-color: var(--black); color: var(--black); }
.leaderboard-btn.growth.active { background: var(--red); border-color: var(--red); color: white; }
.leaderboard-btn:hover { transform: translateY(-2px); box-shadow: 3px 3px 0 rgba(0,0,0,0.2); }

.toggle-row { display: flex; gap: 8px; margin-bottom: 22px; align-items: center; flex-wrap: wrap; }
.toggle-btn { font: inherit; font-weight: 700; font-size: 12px; border: 2px solid var(--black); background: white; color: var(--black); padding: 6px 13px; border-radius: 8px; cursor: pointer; }
.toggle-btn.active { background: var(--black); color: white; }
.month-select, .week-select { font: inherit; font-weight: 700; font-size: 12px; border: 2px solid var(--black); background: white; color: var(--black); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.week-select { border-color: var(--red); color: var(--red); }
.estimate-badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; background: var(--orange); color: #5a2c0f; padding: 3px 9px; border-radius: 20px; }

.region-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.region-card { background: white; border: 2px solid var(--black); border-radius: 14px; padding: 18px; cursor: pointer;
  transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s ease; position: relative; overflow: hidden; animation: popIn 0.32s cubic-bezier(.34,1.56,.64,1) backwards; }
.region-card:hover { transform: translateY(-4px) rotate(-1.2deg); box-shadow: 6px 6px 0 var(--black); }
.region-card:nth-child(even):hover { transform: translateY(-4px) rotate(1.2deg); }
.region-card .bar { position: absolute; top:0; left:0; right:0; height:6px; }
.region-card .code { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 22px; margin: 8px 0 2px; }
.region-card .fullname { font-size: 12px; color: var(--muted); margin-bottom: 14px; font-weight: 600;}
.region-card .hours { font-size: 24px; font-weight: 700; }
.region-card .hours.fake::after { content: "*"; color: var(--red); }
.region-card .yoy { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
.yoy.up { background: #e3f6e0; color: #1d7a2c; }
.yoy.down { background: #fde4e0; color: var(--red); }
.region-card .count { font-size: 12px; color: var(--muted); margin-top: 6px; }
.region-card .arrow { position: absolute; right: 16px; bottom: 16px; font-size: 18px; opacity: 0.25; }

.leaderboard-card {
  border-radius: 14px; border: 2px solid var(--black); padding: 18px; cursor: pointer;
  transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s ease; position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 14px; animation: popIn 0.32s cubic-bezier(.34,1.56,.64,1) backwards;
}
.leaderboard-card:hover { transform: translateY(-4px) rotate(-1deg); box-shadow: 6px 6px 0 var(--black); }
.leaderboard-card .lb-icon { font-size: 34px; line-height: 1; flex-shrink: 0; }
.leaderboard-card .lb-title { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 19px; }
.leaderboard-card .lb-sub { font-size: 12px; margin-top: 3px; opacity: 0.85; }
.leaderboard-card.guns { background: var(--yellow); color: var(--black); }
.leaderboard-card.full { background: var(--black); color: white; }
.leaderboard-card.goal { background: var(--tealgreen); color: var(--black); }
.leaderboard-card.risk { background: var(--orange); color: var(--black); }
.leaderboard-card.growth { background: var(--lightblue); color: var(--black); }
.leaderboard-card .lb-arrow { margin-left: auto; font-size: 20px; opacity: 0.4; }

.search-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
.search-row input { flex: 1; font: inherit; font-size: 14px; padding: 10px 14px; border: 2px solid var(--black); border-radius: 8px; background: white; }
.list-summary { font-size: 13px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
table.franchise-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.franchise-table th { text-align: left; padding: 10px 12px; background: var(--black); color: white; font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; cursor: pointer; user-select: none; }
table.franchise-table th:hover { background: #333; }
table.franchise-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
table.franchise-table tr.data-row { cursor: pointer; transition: transform 0.12s ease; }
table.franchise-table tr.data-row:hover { background: #FDF3EC; transform: scale(1.004); }
.pct { font-weight: 700; }
.pct.up { color: #1d7a2c; } .pct.down { color: var(--red); }

.detail-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
.detail-head h2 { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 24px; margin: 0 0 4px; }
.detail-head .loc { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.region-pill { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 20px; color: white; }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; margin-bottom: 26px; }
.kpi { background: white; border: 2px solid var(--black); border-radius: 12px; padding: 14px 16px; animation: popIn 0.32s cubic-bezier(.34,1.56,.64,1) backwards; }
.kpi:nth-child(2) { animation-delay: 0.04s; } .kpi:nth-child(3) { animation-delay: 0.08s; }
.kpi .label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.4px;}
.kpi .val { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; margin: 4px 0; }
.kpi .sub { font-size: 12px; color: var(--muted); }

.chart-card { background: white; border: 2px solid var(--black); border-radius: 14px; padding: 20px; animation: popIn 0.32s cubic-bezier(.34,1.56,.64,1) backwards; }
.chart-card h3 { margin: 0 0 4px; font-family:'Poppins',sans-serif; font-size: 16px; font-weight: 700;}
.chart-card .note { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.legend { display: flex; gap: 18px; margin-top: 10px; font-size: 12px; font-weight: 600; }
.legend .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle;}
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.fake-note { font-size: 11.5px; color: var(--muted); margin: -4px 0 16px; }
.fake-note b { color: var(--red); }

.toggle-btn, .nav-btn, .back-btn { transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), background 0.15s ease; }
.toggle-btn:hover, .nav-btn:hover, .back-btn:hover { transform: translateY(-2px); }
.toggle-btn.active, .nav-btn.active { transform: scale(1.04); }

#view { animation: popIn 0.28s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
</style>
</head>

  cameFromView: null, riskFilter: null, growthFilter: null, goalFilter: null };

function fmt(n){ return Math.round(n).toLocaleString(); }
function pctFmt(p){ if(p==="-"||p===null||p===undefined) return "\u2013"; return (p*100>=0?"+":"")+(p*100).toFixed(1)+"%"; }
function readableTextOn(hex){
  const c = hex.replace('#','');
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  return (r*0.299+g*0.587+b*0.114) > 165 ? "#000" : "#fff";
}

    return;
  }
  if(state.view==="detail" && state.cameFromView==="topguns"){
    el.innerHTML = `<button class="back-btn" onclick="goTopGuns()"><span>&larr;</span> Back to Top Guns</button>`; return;
  }
  if(state.view==="detail" && state.cameFromView==="fulllist"){
    el.innerHTML = `<button class="back-btn" onclick="goFullList()"><span>&larr;</span> Back to Top 20</button>`; return;
  }
  if(state.view==="detail" && state.cameFromView==="goal"){
    el.innerHTML = `<button class="back-btn" onclick="goGoalTracker()"><span>&larr;</span> Back to Hours Goal</button>`; return;
  }
  if(state.view==="detail" && state.cameFromView==="risk"){
    el.innerHTML = `<button class="back-btn" onclick="goAtRisk()"><span>&larr;</span> Back to At Risk</button>`; return;
  }
  if(state.view==="detail" && state.cameFromView==="growth"){

  }

  el.innerHTML = `<button class="back-btn" onclick="${action}"><span>&larr;</span> ${label}</button>`;

      html += `<button class="active" onclick="goFranchiseList('${state.region}')">${rname}</button>`;
    } else if(state.cameFromView==="topguns"){

    } else if(state.cameFromView==="fulllist"){
      const f = DATA.franchisees.find(x=>x.id===state.franchiseId);
      html += `<button onclick="goFullList()">Top 20</button><span class="sep">\u203a</span><button class="active">${f?f.name:''}</button>`;
    } else if(state.cameFromView==="goal"){
      const f = DATA.franchisees.find(x=>x.id===state.franchiseId);
      html += `<button onclick="goGoalTracker()">Hours Goal</button><span class="sep">\u203a</span><button class="active">${f?f.name:''}</button>`;
    } else if(state.cameFromView==="risk"){
      const f = DATA.franchisees.find(x=>x.id===state.franchiseId);
      html += `<button onclick="goAtRisk()">At Risk</button><span class="sep">\u203a</span><button class="active">${f?f.name:''}</button>`;
    } else if(state.cameFromView==="growth"){

function activeFranchisees(){ return DATA.franchisees.filter(f => f.status === 'Active'); }
function franchisesInRegion(code){ return DATA.franchisees.filter(f => (REGION_CODE[f.region]||"Other/Unmatched") === code); }
function periodValFranchise(f){
  if(state.period==='wtd') return {cur:f.wtd_cy||0, pri:f.wtd_py||0};
  if(state.period==='mtd') return {cur:f.mtd_cy||0, pri:f.mtd_py||0};
  return {cur:f.ytd_cy||0, pri:f.ytd_py||0};
}

function currentRegionSource(){

// ---------------- Goal tracker (Hours) ----------------
const HOURS_GOAL_TARGET = 3000; // annual hours per franchise -- adjustable assumption, see note in view
const GOAL_NEAR_PCT = 0.8;
const GOAL_NETWORK_TARGET_PCT = 0.5;
function periodsLoadedCount(){ return (DATA.periodsAvailable || []).length || 1; }
function annualized(f){
  if(state.period === 'wtd') return (f.wtd_cy||0) * 52;
  if(state.period === 'mtd') return (f.mtd_cy||0) * 12;
  return ((f.ytd_cy||0) / periodsLoadedCount()) * 52;
}
function annualizedBasisLabel(){
  if(state.period === 'wtd') return `latest week loaded \u00d7 52`;
  if(state.period === 'mtd') return `latest month loaded \u00d7 12`;
  return `average of ${periodsLoadedCount()} week(s) loaded so far \u00d7 52`;
}

function goalBucket(pct){ if(pct >= 1) return 'At Goal'; if(pct >= GOAL_NEAR_PCT) return 'Near Goal'; return 'Below Goal'; }
const GOAL_BUCKET_COLOR = { 'At Goal': '#95D5D1', 'Near Goal': '#F0E145', 'Below Goal': '#A7A9AB' };

function renderGoalTracker(){
  const active = activeFranchisees();
  const allRows = active.map(f => { const ann = annualized(f); const pct = ann / HOURS_GOAL_TARGET; return {...f, annualized: ann, pct, bucket: goalBucket(pct)}; });

  // Summary counts always reflect the FULL active set, independent of the search box --
  // otherwise typing a search term would make these numbers stop summing to "total".
  const atGoal = allRows.filter(f=>f.bucket==='At Goal').length;
  const nearGoal = allRows.filter(f=>f.bucket==='Near Goal').length;
  const belowGoal = allRows.filter(f=>f.bucket==='Below Goal').length;
  const total = active.length;
  const atOrNearPct = total ? (atGoal+nearGoal)/total : 0;
  const atGoalPct = total ? atGoal/total : 0;
  const bucketCounts = {'At Goal': atGoal, 'Near Goal': nearGoal, 'Below Goal': belowGoal};

  let rows = allRows;
  if(state.goalFilter){ rows = rows.filter(f => f.bucket === state.goalFilter); }
  if(state.search){ const q = state.search.toLowerCase(); rows = rows.filter(f => f.name.toLowerCase().includes(q) || (f.dba||"").toLowerCase().includes(q)); }
  rows.sort((a,b) => b.pct - a.pct);

  let html = `
    <div class="detail-head">
      <div>
        <h2>\U0001F3AF Hours Goal</h2>
        <div class="loc">${total} active franchises \u00b7 goal: 50% at or over ${fmt(HOURS_GOAL_TARGET)} annualized hours${state.goalFilter ? ' \u00b7 filtered to ' + state.goalFilter : ''}${state.period!=='ytd' ? ' \u00b7 ' + (DATA.currentPeriod||'') : ''}</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        ${filterControlsHTML()}
        <button class="back-btn" onclick="exportGoalTracker()" style="margin-bottom:0;">\u2b07 Export CSV</button>
      </div>
    </div>
    <div class="fake-note"><b>*</b> ${fmt(HOURS_GOAL_TARGET)} hours/year is a placeholder target (roughly between the network's median and average annualized pace) \u2014 swap in the real per-franchise goal whenever you have it. "Annualized" here = ${annualizedBasisLabel()}, a rough run-rate estimate, not a true trailing-12-month figure (this data only covers ${((DATA.periodsAvailable&&DATA.periodsAvailable[0])||'')}\u2013${DATA.currentPeriod}). The shorter the window (WTD is roughest, YTD is steadiest), the more a single busy or slow period can swing the estimate. "Active" excludes franchises marked "In Training." Click a bucket below to filter the list, click again to clear.</div>
    <div class="chart-card" style="margin-bottom:20px; padding:18px;">
      <div style="font-weight:700; font-size:13px; color:var(--muted); margin-bottom:12px;">${(atGoalPct*100).toFixed(1)}% of the network is at goal \u00b7 ${(atOrNearPct*100).toFixed(1)}% is at or near goal \u00b7 network-wide target: 50%</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
        ${['At Goal','Near Goal','Below Goal'].map(cat => {
          const isActive = state.goalFilter === cat;
          const label = cat === 'Near Goal' ? `Near Goal (${(GOAL_NEAR_PCT*100).toFixed(0)}\u201399% of own target)` : cat;
          return `<div onclick="setGoalFilter('${cat}')" style="cursor:pointer; flex:1; min-width:140px; border:2px solid ${isActive?GOAL_BUCKET_COLOR[cat]:'var(--black)'}; border-radius:10px; padding:10px 12px; background:${GOAL_BUCKET_COLOR[cat]}${isActive?'66':'33'};">
            <div style="font-size:22px; font-weight:800; font-family:'Poppins',sans-serif;">${bucketCounts[cat]}</div>
            <div style="font-size:11.5px; font-weight:700; color:#333;">${label}${isActive?' \u2713':''}</div>
          </div>`;
        }).join('')}
      </div>
      ${state.goalFilter ? `<button class="back-btn" onclick="setGoalFilter('${state.goalFilter}')" style="margin:0 0 14px; font-size:11.5px;">\u2715 Clear filter (${state.goalFilter})</button>` : ''}
      <div style="height:22px; border-radius:11px; background:#eee; overflow:hidden; display:flex; border:2px solid var(--black);">
        <div style="width:${(atGoalPct*100).toFixed(2)}%; background:${GOAL_BUCKET_COLOR['At Goal']};"></div>
        <div style="width:${((atOrNearPct-atGoalPct)*100).toFixed(2)}%; background:${GOAL_BUCKET_COLOR['Near Goal']};"></div>
      </div>
      <div style="position:relative; height:0;">
        <div style="position:absolute; top:-24px; left:${(GOAL_NETWORK_TARGET_PCT*100).toFixed(2)}%; transform:translateX(-50%); font-size:11px; font-weight:800; color:var(--red);">\u25bc 50% goal</div>
      </div>
    </div>
    <div class="search-row">
      <input type="text" placeholder="Search franchise or location..." value="${state.search}" oninput="state.search=this.value; renderGoalTracker(); const i=document.querySelector('.search-row input'); i.focus(); i.setSelectionRange(this.value.length,this.value.length);">
    </div>
    <table class="franchise-table">
      <thead><tr><th>Franchise</th><th>Region</th><th>Annualized Hours Est.</th><th>% of Goal</th><th>Status</th></tr></thead>
      <tbody>`;
  if(rows.length===0){ html += `<tr><td colspan="5" class="empty">No franchises match ${state.goalFilter ? '"'+state.goalFilter+'"' : ''} "${state.search}"</td></tr>`; }
  rows.forEach(f => {
    const code = REGION_CODE[f.region] || "Other/Unmatched";
    html += `<tr class="data-row" onclick="goDetail('${f.id}')">
      <td><strong>${f.name}</strong><br><span style="color:var(--muted);font-size:12px">${f.dba||''}</span></td>
      <td>${code}${EMOJI[code]?' '+EMOJI[code]:''}</td>
      <td>${fmt(f.annualized)} hrs</td>
      <td>${(f.pct*100).toFixed(0)}%</td>
      <td><span style="display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; background:${GOAL_BUCKET_COLOR[f.bucket]}66; color:#333;">${f.bucket}</span></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById('view').innerHTML = html;
}

function exportGoalTracker(){
  const active = activeFranchisees();
  let source = active.map(f => { const ann = annualized(f); const pct = ann/HOURS_GOAL_TARGET; return {...f, annualized: ann, pct, bucket: goalBucket(pct)}; });
  if(state.goalFilter) source = source.filter(f => f.bucket === state.goalFilter);
  const rows = source.map(f => ({Franchise: f.name, Location: f.dba, Region: REGION_CODE[f.region]||"Other/Unmatched",
      Basis: state.period.toUpperCase(), Month: (DATA.currentPeriod||''),
      "Annualized Hours Estimate": Math.round(f.annualized), "% of Goal": (f.pct*100).toFixed(1)+"%", Status: f.bucket})
  ).sort((a,b)=> parseFloat(b["% of Goal"]) - parseFloat(a["% of Goal"]));
  const suffix = (state.goalFilter ? '_' + state.goalFilter.replace(/\s+/g,'_') : '') + '_' + state.period;
  downloadCSV(rows, ["Franchise","Location","Region","Basis","Month","Annualized Hours Estimate","% of Goal","Status"], `hours_goal_tracker${suffix}.csv`);
}

// ---------------- At Risk ----------------
const RISK_LOW_HOURS_MONTHLY = 50; // assumption -- flag if this cutoff should be different
const RISK_CATEGORY_COLOR = { 'No Data':'#ED1B2E', 'Zero Hours':'#ED1B2E', 'Sparse Data':'#F8A97F', 'Inconsistent':'#6E4E6E', 'Low Hours':'#A7A9AB' };
function riskAssessmentYTD(f){
  const t = DATA.trend[f.id] || [];
  const periodsReported = t.length;
  const vals = t.map(x=>x.cy);
  const zeroPeriods = vals.filter(v=>v===0).length;
  const nonzeroPeriods = vals.filter(v=>v>0).length;
  const avgPeriod = periodsReported ? vals.reduce((a,b)=>a+b,0)/periodsReported : 0;
  let category = null, severity = 0;
  if(periodsReported === 0){ category='No Data'; severity=4; }
  else if(nonzeroPeriods === 0){ category='Zero Hours'; severity=4; }
  else if(periodsReported <= 2){ category='Sparse Data'; severity=3; }
  else if(zeroPeriods > 0){ category='Inconsistent'; severity=2; }
  else if(avgPeriod < RISK_LOW_HOURS_MONTHLY){ category='Low Hours'; severity=1; }
  return {periodsReported, zeroPeriods, nonzeroPeriods, avgPeriod, category, severity};
}
function riskAssessmentSinglePeriod(f){
  const t = periodValFranchise(f);
  const value = t.cur;
  let category = null, severity = 0;
  if(value === 0){ category='Zero Hours'; severity=4; }
  else if(value < RISK_LOW_HOURS_MONTHLY){ category='Low Hours'; severity=1; }
  return {periodsReported: value>0?1:0, avgPeriod: value, category, severity};
}
function riskAssessment(f){ return state.period === 'ytd' ? riskAssessmentYTD(f) : riskAssessmentSinglePeriod(f); }
function riskCategoriesForPeriod(){
  return state.period === 'ytd' ? ['No Data','Zero Hours','Sparse Data','Inconsistent','Low Hours'] : ['Zero Hours','Low Hours'];
}
function atRiskFranchisees(){
  return activeFranchisees().map(f => ({...f, risk: riskAssessment(f)})).filter(f => f.risk.category !== null);
}
function renderAtRisk(){
  let rows = atRiskFranchisees();
  if(state.riskFilter){ rows = rows.filter(f => f.risk.category === state.riskFilter); }
  if(state.search){ const q = state.search.toLowerCase(); rows = rows.filter(f => f.name.toLowerCase().includes(q) || (f.dba||"").toLowerCase().includes(q) || (f.risk.category||"").toLowerCase().includes(q)); }
  rows.sort((a,b) => b.risk.severity - a.risk.severity || a.risk.avgPeriod - b.risk.avgPeriod);

  const counts = {};
  atRiskFranchisees().forEach(f => { counts[f.risk.category] = (counts[f.risk.category]||0) + 1; });
  const total = activeFranchisees().length;
  const flaggedTotal = atRiskFranchisees().length;
  const categories = riskCategoriesForPeriod();
  const isYTD = state.period === 'ytd';
  const periodLabel = isYTD ? `${((DATA.periodsAvailable&&DATA.periodsAvailable[0])||'')}\u2013${DATA.currentPeriod} (all ${periodsLoadedCount()} months)` : `${(DATA.currentPeriod||'')} 2026`;
  const hoursColLabel = isYTD ? 'Avg Monthly Hours' : (state.period==='wtd' ? 'Est. Weekly Hours' : `${(DATA.currentPeriod||'')} Hours`);

  let html = `
    <div class="detail-head">
      <div>
        <h2>\u26A0\uFE0F At Risk</h2>
        <div class="loc">${flaggedTotal} of ${total} active franchises flagged${state.riskFilter ? ' \u00b7 filtered to ' + state.riskFilter : ''} \u00b7 ${periodLabel}</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        ${filterControlsHTML()}
        <button class="back-btn" onclick="exportAtRisk()" style="margin-bottom:0;">\u2b07 Export CSV</button>
      </div>
    </div>
    <div class="fake-note"><b>*</b> ${isYTD
      ? `Based on all ${periodsLoadedCount()} months of data loaded (${((DATA.periodsAvailable&&DATA.periodsAvailable[0])||'')}\u2013${DATA.currentPeriod}). <b>No Data</b> = never appears in a monthly export. <b>Zero Hours</b> = reports every month but always 0. <b>Sparse Data</b> = only 1\u20132 of ${periodsLoadedCount()} months reported. <b>Inconsistent</b> = some months reported at 0 mixed with active months (possible gaps). <b>Low Hours</b> = consistently reporting, but averaging under ${fmt(RISK_LOW_HOURS_MONTHLY)} hrs/month.`
      : `Based on ${(DATA.currentPeriod||'')} 2026 only. <b>No Data</b> = no row at all for this franchise that month. <b>Zero Hours</b> = reported, but 0 that month. <b>Low Hours</b> = reported under ${fmt(RISK_LOW_HOURS_MONTHLY)} that month. "Sparse Data" and "Inconsistent" describe a pattern across months \u2014 switch to YTD for those.`
    } These are data-quality/reporting flags, not confirmed franchise health \u2014 worth a manual look before acting on any of them, and let me know if these definitions or the ${fmt(RISK_LOW_HOURS_MONTHLY)}-hour cutoff should change. Only Active franchises are checked. Click a category to filter, click again to clear.</div>
    <div class="chart-card" style="margin-bottom:20px; padding:18px;">
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        ${categories.map(cat => {
          const isActive = state.riskFilter === cat;
          return `<div onclick="setRiskFilter('${cat}')" style="cursor:pointer; flex:1; min-width:120px; border:2px solid ${isActive?RISK_CATEGORY_COLOR[cat]:'var(--black)'}; border-radius:10px; padding:10px 12px; background:${RISK_CATEGORY_COLOR[cat]}${isActive?'44':'22'};">
            <div style="font-size:22px; font-weight:800; font-family:'Poppins',sans-serif; color:${RISK_CATEGORY_COLOR[cat]};">${counts[cat]||0}</div>
            <div style="font-size:11.5px; font-weight:700; color:var(--muted);">${cat}${isActive?' \u2713':''}</div>
          </div>`;
        }).join('')}
      </div>
      ${state.riskFilter ? `<button class="back-btn" onclick="setRiskFilter('${state.riskFilter}')" style="margin:12px 0 0; font-size:11.5px;">\u2715 Clear filter (${state.riskFilter})</button>` : ''}
    </div>
    <div class="search-row">
      <input type="text" placeholder="Search franchise, location, or category..." value="${state.search}" oninput="state.search=this.value; renderAtRisk(); const i=document.querySelector('.search-row input'); i.focus(); i.setSelectionRange(this.value.length,this.value.length);">
    </div>
    <table class="franchise-table">

const GROWTH_BUCKET_COLOR = { 'High Growth':'#95D5D1', 'New Growth':'#A0DAE7', 'Steady Growth':'#F0E145', 'Stable Base':'#F8A97F' };
const GROWTH_BUCKET_ORDER = { 'High Growth':3, 'New Growth':2, 'Steady Growth':1, 'Stable Base':0 };
function growthPct(f){
  if(state.period === 'ytd'){ if(!f.ytd_py) return null; return (f.ytd_cy - f.ytd_py) / f.ytd_py; }
  const t = periodValFranchise(f);
  if(!t.pri) return null;
  return (t.cur - t.pri) / t.pri;
}
function isNewGrowth(f){
  if(state.period === 'ytd') return f.ytd_py === 0 && f.ytd_cy > 0;
  const t = periodValFranchise(f);
  return t.pri === 0 && t.cur > 0;
}
function growthBucket(f){
  const ann = annualized(f);
  if(ann >= HOURS_GOAL_TARGET) return null;
  const riskCat = riskAssessment(f).category;
  if(riskCat === 'No Data' || riskCat === 'Zero Hours' || riskCat === 'Sparse Data') return null;
  if(isNewGrowth(f)) return 'New Growth';
  const g = growthPct(f);
  if(g === null) return null;
  if(g >= 0.20) return 'High Growth';
  if(g >= 0) return 'Steady Growth';
  if(g >= -0.10) return 'Stable Base';
  return null;
}
function growthCandidates(){
  return activeFranchisees().map(f => {
    const bucket = growthBucket(f);
    const growth = growthPct(f);
    const ann = annualized(f);
    const pctOfGoal = ann / HOURS_GOAL_TARGET;
    return {...f, bucket, growth, annualized: ann, pctOfGoal};
  }).filter(f => f.bucket !== null);
}

function downloadCSV(rows, headers, filename){
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(",")];
  rows.forEach(r => lines.push(headers.map(h => esc(r[h] ?? "")).join(",")));
  const blob = new Blob([lines.join("\n")], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function lightenHex(hex, pct){
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);

}

function renderRegionBarChart(items){
  const w = 900, h = 260, pad = 40, bottomPad = 34;
  const maxVal = Math.max(...items.map(it=>Math.max(it.cur,it.pri)), 1);
  const groupW = (w - pad*2) / items.length;
  const barW = groupW * 0.30;
  const scaleY = v => (h - bottomPad) - (v/maxVal)*(h - bottomPad - 20);
  let bars = "";
  items.forEach((it,i)=>{
    const gx = pad + i*groupW + groupW/2;
    const curX = gx - barW - 3; const priX = gx + 3;
    const curY = scaleY(it.cur); const priY = scaleY(it.pri); const baseY = h - bottomPad;
    bars += `<rect x="${curX}" y="${curY}" width="${barW}" height="${baseY-curY}" rx="3" fill="${it.color}"/>`;
    bars += `<rect x="${priX}" y="${priY}" width="${barW}" height="${baseY-priY}" rx="3" fill="#c9c5ba"/>`;
    bars += `<text x="${curX+barW/2}" y="${curY-6}" font-size="10.5" font-weight="700" text-anchor="middle" fill="${it.color==='#000000'?'#000':it.color}">${fmt(it.cur)}</text>`;
    bars += `<text x="${priX+barW/2}" y="${priY-6}" font-size="10.5" font-weight="600" text-anchor="middle" fill="#9a9689">${fmt(it.pri)}</text>`;
    bars += `<text x="${gx}" y="${h-10}" font-size="12.5" font-weight="800" text-anchor="middle" fill="#1a1a1a">${it.code}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    <line x1="${pad}" y1="${h-bottomPad}" x2="${w-pad}" y2="${h-bottomPad}" stroke="#E7E4DC" stroke-width="1.5"/>
    ${bars}
  </svg>`;
}

        <span><span class="dot" style="background:#c9c5ba"></span>Prior Year</span>
      </div>
    </div>
    <div class="search-row">
      <input type="text" placeholder="Search franchise, location, city..." value="${state.search}" oninput="onSearch(this.value)">
    </div>
    <div class="list-summary">Sorted by ${state.period.toUpperCase()} hours (current year), highest first \u2014 click any column to re-sort, or click a franchise to see its individual trend</div>
    <table class="franchise-table">
      <thead><tr>
        <th onclick="sortBy('name')">Franchise</th>
        <th onclick="sortBy('city')">City</th>
        <th onclick="sortBy('cur')">${state.period.toUpperCase()} Hours (CY)</th>
        <th onclick="sortBy('pri')">Prior Year</th>
        <th onclick="sortBy('pct')">YoY %</th>
      </tr></thead>
      <tbody>`;
  if(rows.length===0){ html += `<tr><td colspan="5" class="empty">No franchises match "${state.search}"</td></tr>`; }
  rows.forEach(f=>{
    const up = (f.pct??0) >= 0;
    html += `<tr class="data-row" onclick="goDetail('${f.id}')">
      <td><strong>${f.name}</strong><br><span style="color:var(--muted);font-size:12px">${f.dba||''}</span></td>
      <td>${f.city||'\u2013'}</td>
      <td>${fmt(f.cur)}</td>
      <td>${fmt(f.pri)}</td>
      <td class="pct ${up?'up':'down'}">${pctFmt(f.pct)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById('view').innerHTML = html;
}
function onSearch(v){ state.search = v; renderFranchiseList(); const inp=document.querySelector('.search-row input'); inp.focus(); inp.setSelectionRange(v.length, v.length); }
function sortBy(key){ if(state.sortKey===key) state.sortDir *= -1; else { state.sortKey=key; state.sortDir=-1; } renderFranchiseList(); }

function renderTopGuns(){
  const all = rankedFranchisees();
  let html = `
    <div class="detail-head">
      <div>
        <h2>Top Guns</h2>
        <div class="loc">Top 3 franchises per tier \u2014 ${state.period.toUpperCase()} view${state.period!=='ytd' ? ' \u00b7 ' + (DATA.currentPeriod||'') : ''}</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        ${filterControlsHTML()}
        <button class="back-btn" onclick="exportTopGuns()" style="margin-bottom:0;">\u2b07 Export CSV</button>
      </div>
    </div>`;
  TIER_ORDER.forEach(tier=>{
    const top3 = all.filter(f=>f.tier===tier).slice(0,3);
    html += `<h3 style="font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;margin:22px 0 10px;color:${TIER_COLOR[tier]}">${tier}</h3>`;
    html += `<div class="region-grid">`;
    top3.forEach((f,i)=>{
      const code = f.regionCode;
      const up = (f.pct??0) >= 0;
      const shade = tierShade(tier, i);
      html += `
        <div class="region-card" onclick="goDetail('${f.id}')" style="border-color:${shade};">
          <div class="bar" style="background:${shade}"></div>
          <div class="code" style="font-size:15px;">#${i+1} \u00b7 ${code}${EMOJI[code]?' '+EMOJI[code]:''}</div>
          <div class="fullname">${f.name}${f.dba?' \u2014 '+f.dba:''}</div>
          <div class="hours ${state.period==='wtd'?'fake':''}">${fmt(f.cur)} hrs</div>
          <span class="yoy ${up?'up':'down'}">${pctFmt(f.pct)} YoY</span>
        </div>`;
    });
    if(top3.length===0) html += `<div class="empty">No franchises in this tier yet</div>`;
    html += `</div>`;
  });
  document.getElementById('view').innerHTML = html;
}
function renderFullList(){
  let rows = rankedFranchisees();
  if(state.search){ const q = state.search.toLowerCase(); rows = rows.filter(f => f.name.toLowerCase().includes(q) || (f.dba||"").toLowerCase().includes(q) || (f.tier||"").toLowerCase().includes(q)); }
  let html = `
    <div class="detail-head">
      <div>
        <h2>Full Ranked List</h2>
        <div class="loc">All ${rankedFranchisees().length} franchises, every region \u2014 sorted by ${state.period.toUpperCase()} hours, highest first</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        ${filterControlsHTML()}
        <button class="back-btn" onclick="exportFullList()" style="margin-bottom:0;">\u2b07 Export CSV</button>
      </div>
    </div>
    <div class="search-row">
      <input type="text" placeholder="Search franchise, location, or tier..." value="${state.search}" oninput="state.search=this.value; renderFullList(); const i=document.querySelector('.search-row input'); i.focus(); i.setSelectionRange(this.value.length,this.value.length);">
    </div>
    <table class="franchise-table">
      <thead><tr>
        <th>Rank</th><th>Franchise</th><th>Region</th><th>Tier</th>
        <th>${state.period.toUpperCase()} Hours (CY)</th><th>Prior Year</th><th>YoY %</th>
      </tr></thead>
      <tbody>`;
  if(rows.length===0){ html += `<tr><td colspan="7" class="empty">No franchises match "${state.search}"</td></tr>`; }
  rows.forEach((f,i)=>{
    const up = (f.pct??0) >= 0;
    html += `<tr class="data-row" onclick="goDetail('${f.id}')">
      <td>${i+1}</td>
      <td><strong>${f.name}</strong><br><span style="color:var(--muted);font-size:12px">${f.dba||''}</span></td>
      <td>${f.regionCode}${EMOJI[f.regionCode]?' '+EMOJI[f.regionCode]:''}</td>
      <td><span style="display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; background:${TIER_COLOR[f.tier]||'#999'}22; color:${TIER_COLOR[f.tier]||'#666'};">${f.tier}</span></td>
      <td>${fmt(f.cur)}</td>
      <td>${fmt(f.pri)}</td>
      <td class="pct ${up?'up':'down'}">${pctFmt(f.pct)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById('view').innerHTML = html;
}

function renderDetail(){
  const f = DATA.franchisees.find(x=>x.id===state.franchiseId);
  const code = REGION_CODE[f.region] || "Other/Unmatched";
  const meta = REGION_META[code];
  const trend = (DATA.trend[f.id]||[]).slice();
  const monthOrder = {}; (DATA.periodsAvailable||[]).forEach((m,i)=>monthOrder[m]=i);
  trend.sort((a,b)=>monthOrder[a.month]-monthOrder[b.month]);

  const pv = periodValFranchise(f);
  const up = pv.pri ? (pv.cur-pv.pri)>=0 : true;
  const pct = pv.pri ? (pv.cur-pv.pri)/pv.pri : null;
  const ytdUp = f.ytd_py ? (f.ytd_cy-f.ytd_py)>=0 : true;
  const ytdPct = f.ytd_py ? (f.ytd_cy-f.ytd_py)/f.ytd_py : null;

  let html = `
    <div class="detail-head">
      <div>
        <h2>${f.name}</h2>
        <div class="loc">${f.dba || 'No DBA on file'} \u00b7 ${f.city||'\u2013'}, ${f.country||'\u2013'}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="region-pill" style="background:${meta.color};color:${readableTextOn(meta.color)}">${meta.name}</span>
        <button class="back-btn" onclick="exportFranchiseDetail('${f.id}')" style="margin-bottom:0;">\u2b07 Export CSV</button>
      </div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">${state.period.toUpperCase()} Hours${state.period==='wtd'?' (est.)':''}</div><div class="val">${fmt(pv.cur)}</div><div class="sub pct ${up?'up':'down'}">${pctFmt(pct)} vs last year</div></div>
      <div class="kpi"><div class="label">YTD Hours</div><div class="val">${fmt(f.ytd_cy)}</div><div class="sub pct ${ytdUp?'up':'down'}">${pctFmt(ytdPct)} vs last year</div></div>
      <div class="kpi"><div class="label">Bang ID</div><div class="val" style="font-size:18px">${f.id}</div><div class="sub">Master list reference</div></div>
    </div>
    <div class="chart-card">
      <h3>Monthly hours \u2014 current year vs. prior year</h3>
      <div class="note">${trend.length} month(s) loaded so far</div>
      ${renderChart(trend, meta)}
      <div class="legend">
        <span><span class="dot" style="background:${meta.color}"></span>Current Year</span>
        <span><span class="dot" style="background:#c9c5ba"></span>Prior Year</span>
      </div>
    </div>
  `;
  document.getElementById('view').innerHTML = html;
}
function renderChart(trend, meta){
  if(trend.length===0) return `<div class="empty">No monthly data yet</div>`;
  const w = 900, h = 240, pad = 36;
  const maxVal = Math.max(...trend.map(t=>Math.max(t.cy,t.py)), 1);
  const stepX = (w - pad*2) / (trend.length - 1 || 1);
  const scaleY = v => h - pad - (v/maxVal)*(h - pad*1.6);
  function pathFor(key){ return trend.map((t,i)=>`${i===0?'M':'L'} ${pad+i*stepX} ${scaleY(t[key])}`).join(' '); }
  let bars = "";
  trend.forEach((t,i)=>{
    const x = pad + i*stepX;
    bars += `<text x="${x}" y="${h-10}" font-size="12" font-weight="600" text-anchor="middle" fill="#6b675f">${t.month}</text>`;
    bars += `<circle cx="${x}" cy="${scaleY(t.py)}" r="4" fill="#c9c5ba"/>`;
    bars += `<circle cx="${x}" cy="${scaleY(t.cy)}" r="4" fill="${meta.color}"/>`;
    bars += `<text x="${x}" y="${scaleY(t.cy)-10}" font-size="11" font-weight="700" text-anchor="middle" fill="${meta.color==='#000000'?'#000':meta.color}">${Math.round(t.cy)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#E7E4DC" stroke-width="1.5"/>
    <path d="${pathFor('py')}" fill="none" stroke="#c9c5ba" stroke-width="2.5" stroke-dasharray="5,4"/>
    <path d="${pathFor('cy')}" fill="none" stroke="${meta.color}" stroke-width="3"/>
    ${bars}
  </svg>`;
}

function render(){
  renderBack(); renderCrumbs(); renderRegionNav(); renderLeaderboardNav(); renderToggle();
  if(state.view==="regions") renderRegions();
  else if(state.view==="franchise") renderFranchiseList();
  else if(state.view==="detail") renderDetail();
  else if(state.view==="topguns") renderTopGuns();
  else if(state.view==="fulllist") renderFullList();
  else if(state.view==="goal") renderGoalTracker();
  else if(state.view==="risk") renderAtRisk();
  else if(state.view==="growth") renderGrowthCandidates();
}
function loadData(){
  const viewEl = document.getElementById('view');
  if(APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    viewEl.innerHTML = `<div class="empty" style="padding:60px 20px;">
      <div style="font-size:16px;font-weight:700;margin-bottom:8px;">No data source configured yet</div>
      <div style="max-width:480px;margin:0 auto;">Set <code>APPS_SCRIPT_URL</code> near the top of the &lt;script&gt; tag to your
      deployed Apps Script Web App URL (Deploy &gt; New deployment &gt; Web app in the Google Sheet's script editor),
      then reload this page.</div>
    </div>`;
    return;
  }
  viewEl.innerHTML = `<div class="empty" style="padding:60px 20px;">Loading live data from the Sheet\u2026</div>`;
  fetch(APPS_SCRIPT_URL)
    .then(r => { if(!r.ok) throw new Error('Server responded with ' + r.status); return r.json(); })
    .then(json => {
      DATA = json;
      if(!DATA.franchisees || DATA.franchisees.length === 0){
        viewEl.innerHTML = `<div class="empty" style="padding:60px 20px;">
          <div style="font-size:16px;font-weight:700;margin-bottom:8px;">Connected, but no data yet</div>
          <div>The Sheet is reachable, but Raw Import looks empty \u2014 upload a report first.</div>
        </div>`;
        return;
      }
      render();
    })
    .catch(err => {
      viewEl.innerHTML = `<div class="empty" style="padding:60px 20px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:var(--red);">Couldn't load data</div>
        <div style="max-width:480px;margin:0 auto;">${err.message}. Check that the Apps Script is deployed as a Web app with
        access set to "Anyone", and that the URL in <code>APPS_SCRIPT_URL</code> is correct.</div>
      </div>`;
    });
}
loadData();
</script>
